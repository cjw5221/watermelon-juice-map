<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>국특원 수박주스 평가맵</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 0;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
      line-height: 1.6;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .score-box {
      background: #f8f9fb;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }

    .score-box label {
      margin-bottom: 10px;
    }

    .score-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .score-options input {
      display: none;
    }

    .score-options span {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #ddd;
      cursor: pointer;
      font-size: 14px;
    }

    .score-options input:checked + span {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    .total {
      font-size: 22px;
      font-weight: 800;
      margin: 10px 0 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    .notice {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      background: #fff8e1;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .result-table th,
    .result-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }

    .result-table th {
      background: #f3f4f6;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h1>국특원 수박주스 평가맵</h1>
      <p>
        국립특수교육원 주변 카페의 수박주스를 직원들이 함께 평가하는 참여형 맛지도입니다.
        평가는 5점 척도이며, 총점은 30점 만점입니다.
      </p>
    </div>

    <div class="card">
      <div class="notice">
        ※ 평가는 개인 취향이 반영될 수 있습니다.
        같은 카페라도 방문일, 제조자, 수박 상태에 따라 맛이 달라질 수 있습니다.
      </div>

      <form id="reviewForm">
        <label for="evaluator">평가자 이름 또는 닉네임</label>
        <input type="text" id="evaluator" required placeholder="예: 수박연구사, 디지털과A" />

        <label for="cafe">카페명</label>
        <input type="text" id="cafe" required placeholder="예: ○○커피 배방점" />

        <label for="menu">메뉴명</label>
        <input type="text" id="menu" required value="수박주스" />

        <label for="price">가격</label>
        <input type="number" id="price" required placeholder="예: 4500" />

        <div class="grid">
          <div class="score-box">
            <label>수박 원물감</label>
            <div class="score-options" data-name="watermelon"></div>
          </div>

          <div class="score-box">
            <label>당도 균형</label>
            <div class="score-options" data-name="sweetness"></div>
          </div>

          <div class="score-box">
            <label>시원함</label>
            <div class="score-options" data-name="coolness"></div>
          </div>

          <div class="score-box">
            <label>식감</label>
            <div class="score-options" data-name="texture"></div>
          </div>

          <div class="score-box">
            <label>가격 만족도</label>
            <div class="score-options" data-name="value"></div>
          </div>

          <div class="score-box">
            <label>재구매 의향</label>
            <div class="score-options" data-name="revisit"></div>
          </div>
        </div>

        <p class="total">현재 총점: <span id="totalScore">0</span> / 30</p>

        <label for="comment">한 줄 평가</label>
        <textarea id="comment" placeholder="예: 수박 원물감은 좋지만 단맛은 약한 편. 깔끔한 맛을 좋아하면 추천."></textarea>

        <button type="submit">평가 제출하기</button>
      </form>
    </div>

    <div class="card">
      <h2>평가 결과 요약</h2>
      <p style="color:#666;">카페별 평균점수와 참여자 수를 확인할 수 있습니다.</p>
      <button type="button" onclick="loadResults()" style="margin-bottom:16px;">평가 결과 새로고침</button>

      <table class="result-table">
        <thead>
          <tr>
            <th>순위</th>
            <th>카페명</th>
            <th>평균점수</th>
            <th>참여자 수</th>
            <th>추천 유형</th>
          </tr>
        </thead>
        <tbody id="resultBody">
          <tr>
            <td colspan="5">아직 불러온 데이터가 없습니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlFnJehp7-3xZc5D6mdj7xJkWUe5ESWjjRi7VYa0CYsdX-N3h2pQnxamj43l0RUE4p/exec";

    const scoreItems = document.querySelectorAll(".score-options");

    scoreItems.forEach(box => {
      const name = box.dataset.name;

      for (let i = 1; i <= 5; i++) {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="radio" name="${name}" value="${i}" required>
          <span>${i}</span>
        `;

        box.appendChild(label);
      }
    });

    document.addEventListener("change", updateTotalScore);

    function updateTotalScore() {
      const fields = ["watermelon", "sweetness", "coolness", "texture", "value", "revisit"];
      let total = 0;

      fields.forEach(field => {
        const selected = document.querySelector(`input[name="${field}"]:checked`);

        if (selected) {
          total += Number(selected.value);
        }
      });

      document.getElementById("totalScore").textContent = total;
    }

    document.getElementById("reviewForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const fields = ["watermelon", "sweetness", "coolness", "texture", "value", "revisit"];

      const data = {
        evaluator: document.getElementById("evaluator").value.trim(),
        cafe: document.getElementById("cafe").value.trim(),
        menu: document.getElementById("menu").value.trim(),
        price: document.getElementById("price").value,
        comment: document.getElementById("comment").value.trim()
      };

      fields.forEach(field => {
        const selected = document.querySelector(`input[name="${field}"]:checked`);
        data[field] = selected ? selected.value : "";
      });

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.result === "success") {
          alert("평가가 제출되었습니다.");

          document.getElementById("reviewForm").reset();
          document.getElementById("menu").value = "수박주스";
          document.getElementById("totalScore").textContent = "0";

          loadResults();
        } else {
          alert("제출 오류: " + result.message);
          console.error(result);
        }

      } catch (error) {
        alert("제출 중 오류가 발생했습니다. Apps Script 웹앱 URL과 배포 권한을 확인해 주세요.");
        console.error(error);
      }
    });

    async function loadResults() {
      try {
        const response = await fetch(SCRIPT_URL);
        const rows = await response.json();

        if (!rows || rows.length === 0) {
          document.getElementById("resultBody").innerHTML = `
            <tr><td colspan="5">아직 제출된 평가가 없습니다.</td></tr>
          `;
          return;
        }

        const cafeMap = {};

        rows.forEach(row => {
          const cafe = row.cafe;
          const total = Number(row.total);

          if (!cafe || isNaN(total)) return;

          if (!cafeMap[cafe]) {
            cafeMap[cafe] = {
              cafe: cafe,
              count: 0,
              sum: 0
            };
          }

          cafeMap[cafe].count += 1;
          cafeMap[cafe].sum += total;
        });

        const summary = Object.values(cafeMap)
          .map(item => ({
            cafe: item.cafe,
            count: item.count,
            average: item.sum / item.count
          }))
          .sort((a, b) => b.average - a.average);

        if (summary.length === 0) {
          document.getElementById("resultBody").innerHTML = `
            <tr><td colspan="5">집계할 평가 데이터가 없습니다.</td></tr>
          `;
          return;
        }

        const html = summary.map((item, index) => {
          return `
            <tr>
              <td>${index + 1}</td>
              <td>${item.cafe}</td>
              <td><strong>${item.average.toFixed(1)} / 30</strong></td>
              <td>${item.count}명</td>
              <td><span class="badge">${getType(item.average)}</span></td>
            </tr>
          `;
        }).join("");

        document.getElementById("resultBody").innerHTML = html;

      } catch (error) {
        document.getElementById("resultBody").innerHTML = `
          <tr><td colspan="5">결과를 불러오지 못했습니다.</td></tr>
        `;
        console.error(error);
      }
    }

    function getType(score) {
      if (score >= 27) return "강력 추천";
      if (score >= 24) return "추천";
      if (score >= 21) return "무난함";
      if (score >= 18) return "취향 탐";
      return "개인 취향 차이 있음";
    }
  </script>
</body>
</html>
